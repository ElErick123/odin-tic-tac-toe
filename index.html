<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<body>
    <footer>
        <h1>Tic Tac Toe!</h1>
    </footer>

    <div class="container" id="container">
        <h1 class="turn" id="turn"></h1>
        <div class="board" id="board">
            <button class="invalid-cell"></button>
            <button class="invalid-cell"></button>
            <button class="invalid-cell"></button>
            <button class="invalid-cell"></button>
            <button class="invalid-cell"></button>
            <button class="invalid-cell"></button>
            <button class="invalid-cell"></button>
            <button class="invalid-cell"></button>
            <button class="invalid-cell"></button>
        </div>
        <h2 class="message" id="message"></h2>

        <div class="buttons">
            <button class="button" id="start-button">Start</button>

            <button class="button" id="restart-button">Restart</button>
        </div>
    </div>

    <dialog class="start-game-modal" id="start-game-modal">
        <form action="" method="dialog" onclick="event.stopPropagation()">
            <h2>Name your players!</h2>
            <div class="input-cell">
                <label for="player-one-name">Player One</label>
                <input type="text" id="player-one-name" placeholder="Player One">
            </div>
            <div class="input-cell">
                <label for="player-two-name">Player Two</label>
                <input type="text" id="player-two-name" placeholder="Player Two">
            </div>
            <button type="submit" id="start-game-button">Start Game</button>
        </form>
    </dialog>

    <script src="./script.js"></script>
</body>
</html>
